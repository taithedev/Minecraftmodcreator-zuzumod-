name: Check React studio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Check server syntax
        run: |
          node --check server/index.mjs
          node --check server/lib.mjs
          node --check server/mcp.mjs
      - run: npm test
      - run: npm run build
